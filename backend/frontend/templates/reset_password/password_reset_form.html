{% block content %}
  <h2>Сброс пароля</h2>
  <form method="post">
    {% csrf_token %}
    <div>
      <label for="email">Email:</label>
      <input type="email" name="email" required>
    </div>
    <button type="submit">Отправить ссылку для сброса пароля</button>
  </form>
  <p>Мы отправим вам письмо с ссылкой для сброса пароля.</p>
{% endblock %}
