{% load static %}
{% block content %}
<head>
  <link rel="stylesheet" href="{% static 'css/reset_password/password_reset_confirm.css' %}">
</head>
<div class="container">
  <h2>Сброс пароля</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="new_password1">Новый пароль:</label>
      <input type="password" id="new_password1" name="new_password1" required>
    </div>
    <div class="form-group">
      <label for="new_password2">Подтвердите новый пароль:</label>
      <input type="password" id="new_password2" name="new_password2" required>
    </div>
    <button type="submit">Сбросить пароль</button>
  </form>
</div>
{% endblock %}
