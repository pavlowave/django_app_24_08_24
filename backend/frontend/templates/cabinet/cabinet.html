<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .email {
            font-size: 18px;
            color: #555;
            margin-top: 20px;
            text-align: center;
        }
        .logout-button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .logout-button:hover {
            background-color: #e84118;
        }
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
        }
        .nav-buttons a {
            display: block;
            padding: 12px;
            background-color: #3498db;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .nav-buttons a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Личный кабинет</h1>
        <div class="email">
            <p>Ваш адрес электронной почты: <strong>{{ email }}</strong></p>
        </div>

        <!-- Форма для выхода из системы -->
        <form action="{% url 'logout' %}" method="get">
            {% csrf_token %}
            <button type="submit" class="logout-button">Выйти</button>
        </form>

        <!-- Кнопки навигации -->
        <div class="nav-buttons">
            <a href="{% url 'cabinet' %}">Главная</a>
            <a href="#">Бар</a>
            <a href="#">Тренеры</a>
            <a href="#">Групповые</a>
            <a href="#">Массаж</a>
            <a href="#">Оплата</a>
        </div>
    </div>
</body>
</html>
