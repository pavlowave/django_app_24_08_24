<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля</title>
    <style>
        /* Общие стили */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Стили тёмной темы */
        body.dark-theme {
            background-color: #121212;
            color: #e0e0e0;
        }

        .container.dark-theme {
            background-color: #333;
            color: #e0e0e0;
        }

        label, input[type="text"], textarea, button {
            color: inherit;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Настройки профиля</h1>

        <!-- Блок 1: Настройки темы -->
        <div class="form-section">
            <h2>Настройки темы</h2>
            <form id="themeForm">
                <label for="theme">Выберите тему:</label>
                <div class="theme-options">
                    <input type="radio" id="lightTheme" name="theme" value="light" checked>
                    <label for="lightTheme">Светлая</label>

                    <input type="radio" id="darkTheme" name="theme" value="dark">
                    <label for="darkTheme">Тёмная</label>
                </div>
                <button type="button" onclick="saveTheme()">Сохранить</button>
            </form>
        </div>

        <!-- Блок 2: Настройки профиля -->
        <div class="form-section">
            <h2>Настройки профиля</h2>
            <form id="profileForm" enctype="multipart/form-data">
                <label for="price">Стоимость (в рублях):</label>
                <input type="text" id="price" name="price" placeholder="Введите стоимость">

                <label for="description">Описание профиля:</label>
                <textarea id="description" name="description" rows="4" placeholder="Введите описание"></textarea>

                <!-- Фотографии и кнопка Сохранить -->
                <button type="button" onclick="saveProfile()">Сохранить</button>
            </form>
        </div>
    </div>

    <script>
        function applyTheme(theme) {
            document.body.classList.toggle('dark-theme', theme === 'dark');
            document.querySelector('.container').classList.toggle('dark-theme', theme === 'dark');
        }

        function saveTheme() {
            const theme = document.querySelector('input[name="theme"]:checked').value;
            applyTheme(theme);
            alert("Вы выбрали тему: " + theme);
        }

        function saveProfile() {
            const price = document.getElementById('price').value;
            const description = document.getElementById('description').value;

            alert("Настройки профиля сохранены!\nСтоимость: " + price + "\nОписание: " + description);
        }
    </script>
</body>
</html>
