<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр пользователей</title>
    <style>
        /* Стили можно добавить здесь */
    </style>
</head>
<body>
    <h1>Список пользователей</h1>
    <table>
        <tr>
            <th>Email</th>
            <th>Роль</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.get_role_display }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="{% url 'cabinet' %}">Назад</a>
</body>
</html>
