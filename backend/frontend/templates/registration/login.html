{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="{% static 'css/registration/login.css' %}">
</head>
<body>

<div class="login-container">
    <h2>Авторизация</h2>
    <p>Авторизуйтесь под своим аккаунтом для продолжения</p>
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required>
            <a href="{% url 'password_reset' %}" class="forgot-password">Забыли пароль?</a>
        </div>
        <button type="submit" class="login-btn">Войти</button>
    </form>
    <a href="{% url 'registration' %}" class="register-link">У вас нет учетной записи? Зарегистрируйтесь</a>

    <!-- кнопки для аутентификации -->
    <div class="social-buttons">
        <a class="social-login-btn btn-yandex" href="{% url 'social:begin' 'yandex-oauth2' %}">
            <i class="fab fa-yandex"></i> Войти через Яндекс
        </a>
        <a class="social-login-btn btn-mailru" href="{% url 'social:begin' 'mailru' %}">
            <i class="fab fa-mail.ru"></i> Войти через Mail.ru
        </a>
        <a class="social-login-btn btn-github" href="{% url 'social:begin' 'github' %}">
            <i class="fab fa-github"></i> Войти через GitHub
        </a>
    </div>
</div>

</body>
</html>
