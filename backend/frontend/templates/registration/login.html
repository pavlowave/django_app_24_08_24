<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #45a049;
        }
        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .register-link {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
        .social-login-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin-bottom: 10px;
            display: block;
            text-align: center;
        }
        .social-login-btn i {
            margin-right: 5px;
        }
        .btn-github {
            background-color: #333;
        }
        .btn-github:hover {
            background-color: #24292e;
        }
        .btn-mailru {
            background-color: #ff6600;
        }
        .btn-mailru:hover {
            background-color: #ff5500;
        }
        .btn-yandex {
            background-color: #ffcc00;
        }
        .btn-yandex:hover {
            background-color: #e6b800;
        }
        .social-buttons {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <a href="{% url 'password_reset' %}" class="forgot-password">Forgot your password?</a>
        </div>
        <button type="submit" class="login-btn">Login</button>
    </form>
    <a href="{% url 'registration' %}" class="register-link">Don't have an account? Register here</a>

    <!-- кнопки для аутентификации -->
    <div class="social-buttons">
        <a class="social-login-btn btn-yandex" href="{% url 'social:begin' 'yandex-oauth2' %}">
            <i class="fab fa-yandex"></i> Sign in with Yandex
        </a>
        <a class="social-login-btn btn-mailru" href="{% url 'social:begin' 'mailru' %}">
            <i class="fab fa-mail.ru"></i> Sign in with Mail.ru
        </a>
        <a class="social-login-btn btn-github" href="{% url 'social:begin' 'github' %}">
            <i class="fab fa-github"></i> Sign in with GitHub
        </a>
    </div>
</div>

</body>
</html>
